<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SchooMy 活用マップ ｜ v1.15</title>
<meta name="description" content="スクーミーの活用事例をマップで紹介するランディングページ">
<!-- ======================================================
     SchooMy 活用マップ LP v1.2
     base: Navigation Overlay v6.0 + Map v3.5
     新機能: キャラクリックでページ内モーダル表示（遷移なし）
     データ: 既存の公開CSVをそのまま流用（スプシ変更なし）
     v1.11: モーダル本文にcharacters CSVの「LPmessage」列を表示（吹き出しは従来のmessageのまま／LPmessage空欄ならmessageにフォールバック／TOPは無変更）
     v1.12: 全画面イントロ画像をプレースホルダーから本番5枚(ayashi01-05.png / schoomy.com)に差し替え
     v1.13: イントロのドット・スクロールヒント・スキップボタンを廃止／スライド余白を詰めて画像を少し大きく(9vh8vw→6vh5vw)
     v1.14: イントロ下部に控えめな下向き矢印(↓)だけを表示（白半透明・ふわっと上下・クリック判定なし・最後の画像でLoading移行時に消える）
     v1.15: コマリーのオバケのモーダル本文をcases CSVの「LPayashi」列に変更（空欄ならdescriptionにフォールバック／写真・詳しく見るは無変更／characters側LPmessageとは独立）
====================================================== -->
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    overflow-x: hidden;
  }
  body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
</style>

<style>
/* =========================================================
   v1.2 新規: 全画面イントロ（スクロール連動で画像切替→Loading→マップ）
   背景=SchooMyオレンジ。画像は透過PNG想定。毎回アクセスで表示。
========================================================= */
#schmIntro {
  position: fixed; inset: 0; z-index: 10000;
  background: #E4A334;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; touch-action: none;
  font-family: "Noto Sans JP", "Meiryo", sans-serif;
}
#schmIntro.is-hidden {
  opacity: 0; visibility: hidden;
  transition: opacity 0.6s ease, visibility 0s linear 0.6s;
}
body.schm-intro-lock { overflow: hidden !important; }
.schm-intro-stage { position: relative; width: 100%; height: 100%; cursor: pointer; }
.schm-intro-slide {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 6vh 5vw; box-sizing: border-box; /* v1.13: 余白を詰めて画像を少し大きく（旧 9vh 8vw） */
  opacity: 0; transform: scale(0.97);
  transition: opacity 0.5s ease, transform 0.55s cubic-bezier(0.34,1.56,0.64,1);
  pointer-events: none;
}
.schm-intro-slide.is-active { opacity: 1; transform: scale(1); }
.schm-intro-slide img {
  max-width: 100%; max-height: 100%; object-fit: contain;
  filter: drop-shadow(0 12px 32px rgba(0,0,0,0.18));
}
/* v1.13: ドット・スクロールヒント・スキップを廃止 */
/* v1.14: 控えめな下向き矢印だけを下部中央に表示（クリック判定なし・finish時にJSで非表示） */
.schm-intro-arrow {
  position: absolute; left: 0; right: 0; bottom: 30px; text-align: center;
  color: #ffffff; font-size: 30px; line-height: 1; font-weight: 400;
  opacity: 0.55; z-index: 3; pointer-events: none;
  text-shadow: 0 2px 6px rgba(0,0,0,0.18);
  animation: schmIntroArrowBob 1.8s ease-in-out infinite;
}
@keyframes schmIntroArrowBob { 0%,100%{ transform: translateY(0); opacity: 0.5; } 50%{ transform: translateY(6px); opacity: 0.7; } }
@media screen and (max-width: 760px) { .schm-intro-arrow { bottom: 24px; font-size: 26px; } }
.schm-intro-loading {
  position: absolute; inset: 0; background: #E4A334; z-index: 5;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  opacity: 0; visibility: hidden; transition: opacity 0.4s ease;
}
.schm-intro-loading.is-active { opacity: 1; visibility: visible; }
.schm-intro-figure { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.schm-intro-jitsu { width: 76px; height: auto; display: block; }
.schm-intro-loading-boy { width: 96px; height: auto; display: block; }
/* v1.5: 白トラックを装飾して目立たせる（影＋枠）。塗りは4色を左→右へ確定進行 */
.schm-intro-bar {
  position: relative; width: min(300px, 74vw); height: 16px;
  border-radius: 999px; overflow: hidden;
  background: #ffffff;
  border: 3px solid #ffffff;
  box-shadow: 0 6px 16px rgba(0,0,0,0.22), inset 0 0 0 1px rgba(0,0,0,0.06);
}
.schm-intro-bar-fill {
  position: absolute; top: 0; left: 0; height: 100%; width: 0%;
  /* 4色グラデをトラック幅に固定 → 塗りが伸びるほど左から色が現れる */
  background-image: linear-gradient(90deg,
    #3AABA8 0 31%, #F5E4C4 31% 77%, #E88A0A 77% 85%, #2E8EC4 85% 100%);
  background-size: min(300px, 74vw) 100%;
  background-repeat: no-repeat;
  background-position: left center;
  border-radius: 999px;
}
.schm-intro-loading-text { color: #ffffff; font-weight: 900; font-size: 16px; letter-spacing: 0.1em; }
/* v1.7: 事例ピン(センサーアイコン+写真吹き出し)と事例カードを非表示＝マップはキャラのみ */
.schm-map-pin-wrap { display: none !important; }
.schm-map-panel { display: none !important; }
@media screen and (max-width: 760px) {
  .schm-intro-jitsu { width: 62px; }
  .schm-intro-loading-boy { width: 80px; }
}
/* v1.9: コマリー“オバケ”（元センサー位置にランダム出現・ふわっと出て消える） */
.schm-ghost {
  position: absolute; left: 0; top: 0;
  width: clamp(42px, 3.6vw, 72px); height: auto;
  transform: translate(-50%, -50%) translateY(12px);
  opacity: 0;
  pointer-events: auto; cursor: pointer; z-index: 7;
  filter: drop-shadow(0 6px 12px rgba(0,0,0,0.22));
  transition: opacity 1.4s ease, transform 1.7s cubic-bezier(0.22, 1, 0.36, 1);
}
.schm-ghost img { width: 100%; height: auto; display: block; pointer-events: none; animation: schmGhostBob 3.4s ease-in-out infinite; }
.schm-ghost.is-in { opacity: 0.92; transform: translate(-50%, -50%) translateY(0); }
.schm-ghost.is-out { opacity: 0; transform: translate(-50%, -50%) translateY(-30px); }
@keyframes schmGhostBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@media screen and (max-width: 760px) { .schm-ghost { width: 46px; } }
</style>
</head>

<!-- ====== v1.2 全画面イントロ（スクロール連動→Loading→マップ） ====== -->
<div id="schmIntro" aria-hidden="false">
  <div class="schm-intro-stage" id="schmIntroStage"></div>
  <div class="schm-intro-arrow" id="schmIntroHint" aria-hidden="true">&#8595;</div>
  <div class="schm-intro-loading" id="schmIntroLoading">
    <div class="schm-intro-figure">
      <img class="schm-intro-jitsu" src="assets/intro-jitsu.png" alt="じっ">

<style>
/* =========================================================

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap');

  z-index: 40;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: flex-start;

  list-style: none;
  margin: 0;
  padding: 0;
}

.schoomy-nav-overlay .schoomy-nav-item {
  margin: 0;
  padding: 0;
  list-style: none;
}

.schoomy-nav-overlay .schoomy-nav-link {
  display: inline-block;

  color: #ffffff !important;
  font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "ヒラギノ角ゴ ProN W6", "Meiryo", "メイリオ", sans-serif;

.schoomy-nav-overlay .schoomy-nav-link::after {

  left: 0;
  bottom: 0;
  width: 0;
  height: 1.5px;
  background-color: #ffffff;
  box-shadow: 0 0 6px rgba(255, 255, 255, 0.6);
  transition: width 0.35s ease;
}

.schoomy-nav-overlay .schoomy-nav-link:hover {
  opacity: 0.9;
}

.schoomy-nav-overlay .schoomy-nav-link:hover::after {
  width: 100%;
}

/* スマホ版：ロゴだけを中央上に表示 */
@media screen and (max-width: 959px) {
  .schoomy-nav-overlay {
    display: flex;
    align-items: center;       /* ロゴを中央寄せ */
    justify-content: center;
    padding: 12px 16px 8px;
    gap: 0;
    background: linear-gradient(
      180deg,
      rgba(26, 26, 34, 0.45) 0%,
      rgba(26, 26, 34, 0.15) 70%,
      rgba(26, 26, 34, 0) 100%
    );
  }

  .schoomy-nav-overlay .schoomy-nav-logo img {
    height: 44px;
  }

  /* スマホ時はメニューリストを非表示 */

    display: none;
  }

  /* v5.4: スマホ時はoVice誘導ボタン（オレンジのアイコン）を非表示 */
  .schoomy-ovice-button {
    display: none !important;
  }
}

/* =========================================================
   v4.3: 事例カード・キャラのサイズを画面幅で自動スケール
   PC（960px以上）でのみ適用、スマホは元のサイズ維持
========================================================= */

    /* 画面幅に応じて 280px〜440px の範囲で（v4.4で縮小） */

  }

  /* 事例カード内テキスト */
  .schoomy-nav-overlay-host .schm-map-case-title {
    font-size: clamp(13px, 1vw, 19px) !important;

    font-size: clamp(10px, 0.75vw, 13px) !important;
  }
  .schoomy-nav-overlay-host .schm-map-case-subtitle {
    font-size: clamp(9px, 0.65vw, 12px) !important;
  }
  .schoomy-nav-overlay-host .schm-map-cat {
    font-size: clamp(8px, 0.55vw, 11px) !important;
  }
  .schoomy-nav-overlay-host .schm-map-link {
    font-size: clamp(10px, 0.75vw, 13px) !important;
    padding: clamp(7px, 0.55vw, 10px) clamp(14px, 1.2vw, 22px) !important;
  }

  /* 事例カードのアイコン */

    width: clamp(44px, 3.6vw, 70px) !important;

  }

  /* センサーピン（マップ上のミニアイコン） */

    width: clamp(52px, 4.4vw, 88px) !important;
    height: clamp(52px, 4.4vw, 88px) !important;
  }

  /* 写真バブル */
  .schoomy-nav-overlay-host .schm-map-bubble {
    width: clamp(160px, 13vw, 260px) !important;
    height: clamp(160px, 13vw, 260px) !important;
  }

  /* =========================================================
     v4.8: oVice誘導アイコン（右下、PC版のみ）
  ========================================================= */
  .schoomy-ovice-button {
    position: absolute;
    right: clamp(32px, 2vw, 48px);
    bottom: clamp(32px, 2vw, 48px);
    z-index: 35;

    pointer-events: auto;
    text-decoration: none;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    animation: schoomyOviceBob 3.5s ease-in-out infinite;
  }
  .schoomy-ovice-button:hover {

  @keyframes schoomyOviceBob {

  /* キャラ画像本体：v6.0

                <span class="schm-map-cat" id="schmMapCaseCat">—</span>
                <div class="schm-map-case-subtitle" id="schmMapCaseSubtitle">—</div>
                <h3 class="schm-map-case-title" id="schmMapCaseTitle">—</h3>
              </div>
            </div>
            <div class="schm-map-body">
              <p class="schm-map-case-desc" id="schmMapCaseDesc">—</p>
              <a class="schm-map-link" id="schmMapCaseLink" href="#" target="_blank" rel="noopener noreferrer">詳しく見る</a>
            </div>
          </div>
        </aside>
        <span class="schm-map-version">LP v1.15</span>
      </div>
    </div>
  </div>
  <!-- ====== ↑↑↑ ここまでマップv3.5本体 ↑↑↑ ====== -->

</div>
<!-- ▲▲ ナビ + マップ全体ラッパー終了 ▲▲ -->

<!-- ====== v1.0 キャラクリック用モーダル本体 ====== -->
<div class="schm-modal-overlay" id="schmCharModal" aria-hidden="true">
  <div class="schm-modal-card" id="schmCharModalCard" role="dialog" aria-modal="true" aria-labelledby="schmCharModalName">
    <button type="button" class="schm-modal-close" id="schmCharModalClose" aria-label="閉じる">&times;</button>
    <img class="schm-modal-img" id="schmCharModalImg" src="" alt="" style="display:none;">
    <div class="schm-modal-name" id="schmCharModalName" style="display:none;"></div>
    <div class="schm-modal-message" id="schmCharModalMessage"></div>
    <a class="schm-modal-btn" id="schmCharModalBtn" href="#" target="_blank" rel="noopener noreferrer" style="display:none;">詳しく見る</a>
  </div>
</div>

<script>
/* PART B: SchooMy Map v3.5 メインスクリプト（LP v1.0：キャラクリックをモーダル表示に変更） */
(function(){
  'use strict';
  const CASES_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSs69yiq4jRIO29qe791ZpIfuH7qgo3WEiDxuXGz9yS4DcIp1rZpmRPF8fzEeegdHmf7ElTbVGlz4S6/pub?output=csv';
  const SENSORS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQHkTphR2g9EaK_vs2jI6bv-RQ0Co7STxgecxjtHjOzdv2ep59sbIGjyMzMPR-UCFSa1v44_OlUf6QM/pub?output=csv';
  const CHARACTERS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSs69yiq4jRIO29qe791ZpIfuH7qgo3WEiDxuXGz9yS4DcIp1rZpmRPF8fzEeegdHmf7ElTbVGlz4S6/pub?gid=1783658194&single=true&output=csv';
  const INTERVAL = 5000;

  const CHAR_BUBBLE_SHOW_MIN = 4000;
  const CHAR_BUBBLE_SHOW_MAX = 7000;
  const CHAR_BUBBLE_HIDE_MIN = 8000;
  const CHAR_BUBBLE_HIDE_MAX = 15000;
  const CHAR_BUBBLE_INITIAL_DELAY_MAX = 4000;

  const CHAR_SIZE_MAP = {
    '小': 50, '中': 70, '大': 90, '特大': 120,
    'small': 50, 'medium': 70, 'large': 90, 'xlarge': 120
  };
  const CHAR_SIZE_DEFAULT = 70;

  const BUBBLE_COLOR_MAP = {
    'ティール': '#3AABA8', 'オレンジ': '#E88A0A', 'ブルー': '#2E8EC4',
    'ピンク': '#E85A8A', 'グリーン': '#5AC85A', 'パープル': '#9B5AC8', 'ダークグレー': '#333839',
    'teal': '#3AABA8', 'orange': '#E88A0A', 'blue': '#2E8EC4',
    'pink': '#E85A8A', 'green': '#5AC85A', 'purple': '#9B5AC8', 'darkgray': '#333839'
  };
  const BUBBLE_COLOR_DEFAULT = '#3AABA8';

  function adjustCardPosition() {
    try {
      const box = document.getElementById('schmMapBox');
      const panel = document.getElementById('schmMapPanel');
      if (!box || !panel) return;
      const stage = box.parentElement;
      if (!stage) return;
      const isMobile = window.innerWidth <= 760;
      if (isMobile) {
        if (panel.parentElement !== stage) stage.appendChild(panel);
      } else {
        if (panel.parentElement !== box) box.appendChild(panel);
      }
    } catch (e) { console.warn('[SchooMy Map LP v1.0] adjustCardPosition error:', e); }
  }

  function applyScale() {
    try {
      const root = document.getElementById('schmMapRoot');
      const box = document.getElementById('schmMapBox');
      if (!root || !box) return;
      if (window.innerWidth <= 760) {
        root.style.setProperty('--map-scale', 1);
        root.style.marginBottom = '';
        return;
      }
      root.style.setProperty('--map-scale', 1);
      void box.offsetWidth;
      const naturalWidth = box.offsetWidth;
      const viewportWidth = window.innerWidth;
      if (naturalWidth <= 0) return;
      const scale = (viewportWidth / naturalWidth) * 1.005;
      if (scale <= 1.001) {
        root.style.setProperty('--map-scale', 1);
        root.style.marginBottom = '';
        return;
      }
      root.style.setProperty('--map-scale', scale);
      const naturalHeight = box.offsetHeight;
      const extraHeight = naturalHeight * (scale - 1);
      root.style.marginBottom = extraHeight + 'px';
    } catch (e) { console.warn('[SchooMy Map LP v1.0] applyScale error:', e); }
  }

  function setupLayout() {
    try {
      adjustCardPosition();
      applyScale();
      window.addEventListener('load', function() {
        try { adjustCardPosition(); applyScale(); } catch (e) {}
      });
      let resizeTimer;
      window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function() {
          try { adjustCardPosition(); applyScale(); } catch (e) {}
        }, 100);
      });
      setTimeout(function() { try { adjustCardPosition(); applyScale(); } catch (e) {} }, 100);
      setTimeout(function() { try { adjustCardPosition(); applyScale(); } catch (e) {} }, 500);
      setTimeout(function() { try { adjustCardPosition(); applyScale(); } catch (e) {} }, 1500);
    } catch (e) { console.warn('[SchooMy Map LP v1.0] setupLayout error:', e); }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupLayout);
  } else {
    setupLayout();
  }

  function normalizeDriveUrl(url) {
    if (!url) return '';
    const s = String(url).trim();
    const m = s.match(/[?&]id=([a-zA-Z0-9_-]+)/) || s.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
    return m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w2400' : s;
  }

  function normalizeIconUrl(url) {
    if (!url) return '';
    const s = String(url).trim();
    const m = s.match(/[?&]id=([a-zA-Z0-9_-]+)/) || s.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
    return m ? 'https://lh3.googleusercontent.com/d/' + m[1] : s;
  }

  function parseCSV(text) {
    const rows = [];
    let row = [], field = '', inQuote = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuote) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuote = false; } else field += c;
      } else {
        if (c === '"') inQuote = true;
        else if (c === ',') { row.push(field); field = ''; }
        else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
        else if (c !== '\r') field += c;
      }
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function csvToObjects(csvText) {
    const rows = parseCSV(csvText).filter(r => r.some(c => c.trim() !== ''));
    if (rows.length < 2) return [];
    const header = rows[0].map(h => h.trim().replace(/^\ufeff/, ''));
    return rows.slice(1).map(r => {
      const obj = {};
      header.forEach((h, i) => obj[h] = (r[i] || '').trim());
      return obj;
    });
  }

  function shuffle(array) {
    const a = [...array];
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function isActiveValue(v) {
    if (v === undefined || v === null) return false;
    const s = String(v).trim().toLowerCase();
    if (s === '') return false;
    return ['true', '1', 'yes', 'y', 'on', '✓', '○'].includes(s);
  }

  function isValidPosValue(v) {
    if (!v) return false;
    const s = String(v).trim();
    return /^-?\d+(\.\d+)?%?$/.test(s);
  }

  function resolveCharSize(v) {
    if (!v) return CHAR_SIZE_DEFAULT;
    const s = String(v).trim();
    if (CHAR_SIZE_MAP[s] !== undefined) return CHAR_SIZE_MAP[s];
    if (CHAR_SIZE_MAP[s.toLowerCase()] !== undefined) return CHAR_SIZE_MAP[s.toLowerCase()];
    const numMatch = s.match(/^(\d+)(?:px)?$/);
    if (numMatch) {
      const n = parseInt(numMatch[1], 10);
      if (n >= 20 && n <= 300) return n;
    }
    return CHAR_SIZE_DEFAULT;
  }

  function resolveBubbleColor(v) {
    if (!v) return BUBBLE_COLOR_DEFAULT;
    const s = String(v).trim();
    if (BUBBLE_COLOR_MAP[s] !== undefined) return BUBBLE_COLOR_MAP[s];
    if (BUBBLE_COLOR_MAP[s.toLowerCase()] !== undefined) return BUBBLE_COLOR_MAP[s.toLowerCase()];
    if (/^#[0-9a-fA-F]{6}$/.test(s)) return s;
    if (/^#[0-9a-fA-F]{3}$/.test(s)) return s;
    return BUBBLE_COLOR_DEFAULT;
  }

  const svgCache = new Map();
  const GRAY_FILLS = new Set(['#ebebeb','#EBEBEB','#eee','#EEE','#eeeeee','#EEEEEE','#f0f0f0','#F0F0F0','#e5e5e5','#E5E5E5','#dddddd','#DDDDDD','#ddd','#DDD','#cccccc','#CCCCCC','#ccc','#CCC','#d3d3d3','#D3D3D3','#e0e0e0','#E0E0E0']);

  function sanitizeSvgText(text) {
    if(!text || !text.includes('<svg')) return null;
    text = text.replace(/<g\s+[^>]*id=["'](Background|background|BG|bg|spec)["'][^>]*>[\s\S]*?<\/g>/gi, '');
    text = text.replace(/\.cls-1\s*\{[^}]*\}/gi, (m) => {
      for(const g of GRAY_FILLS) { if(m.toLowerCase().includes(g.toLowerCase())) return '.cls-1{fill:transparent;}'; }
      return m;
    });
    text = text.replace(/(<svg[^>]*>\s*)<rect\b[^>]*\bfill=["']([^"']+)["'][^>]*\/?>\s*/i, (full, head, fillVal) => {
      if(GRAY_FILLS.has(fillVal) || GRAY_FILLS.has(fillVal.toLowerCase())) return head;
      return full;
    });
    return text;
  }

  async function fetchSvgInline(url) {
    if(svgCache.has(url)) return svgCache.get(url);
    try {
      const res = await fetch(url);
      const text = await res.text();
      const cleaned = sanitizeSvgText(text);
      svgCache.set(url, cleaned);
      return cleaned;
    } catch(e) { return null; }
  }

  let cases = [];
  let navOrder = [];
  let navIdx = 0;
  let activeCaseIdx = 0;
  let autoplay = true;
  let timer = null;

  let characters = [];
  const charBubbleTimers = [];

  /* =========================================================
     v1.0 新規: キャラクリック用モーダル制御
  ========================================================= */
  function openCharModal(c) {
    try {
      const overlay = document.getElementById('schmCharModal');
      const card = document.getElementById('schmCharModalCard');
      const imgEl = document.getElementById('schmCharModalImg');
      const nameEl = document.getElementById('schmCharModalName');
      const msgEl = document.getElementById('schmCharModalMessage');
      const btnEl = document.getElementById('schmCharModalBtn');
      if (!overlay || !card) return;

      // アクセントカラーはキャラの吹き出し色に合わせる
      card.style.setProperty('--schm-modal-color', c.bubble_color || '#3AABA8');

      // キャラ画像（v1.10: 前の画像が一瞬残るのを防ぐ＝即クリア→ロード完了でフェード表示）
      if (c.image) {
        imgEl.style.display = 'block';
        imgEl.alt = c.name || '';
        imgEl.onload = function(){ imgEl.style.opacity = '1'; };
        imgEl.onerror = function(){ imgEl.style.opacity = '1'; };
        if (imgEl.getAttribute('src') !== c.image) {
          imgEl.style.opacity = '0';   // 別画像に変わる時だけ前画像を隠す
          imgEl.src = c.image;
        }
        // 既にキャッシュ済み(complete)なら即表示してフェード待ちを作らない
        if (imgEl.complete && imgEl.naturalWidth > 0) { imgEl.style.opacity = '1'; }
      } else {
        imgEl.style.display = 'none';
      }

      // 名前
      if (c.name && c.name.trim() !== '') {
        nameEl.textContent = c.name;
        nameEl.style.display = 'block';
      } else {
        nameEl.style.display = 'none';
      }

      // メッセージ（v1.11: モーダル本文はLPmessage優先。空欄なら吹き出しと同じmessageにフォールバック）
      const modalText = (c.lp_message && c.lp_message.trim() !== '') ? c.lp_message
                       : ((c.message && c.message.trim() !== '') ? c.message : '');
      msgEl.textContent = modalText;

      // === 将来拡張ポイント =========================================
      //   スプシに新列 popup_title / popup_body / popup_image / popup_button
      //   を足したら、ここで読み込んで上書きするだけでリッチ化できる。
      //   （列を足すまでは既存のmessage / link_urlだけで動作する）
      //   例:
      //   if (c.popup_title) { nameEl.textContent = c.popup_title; nameEl.style.display='block'; }
      //   if (c.popup_body)  { msgEl.textContent = c.popup_body; }
      //   if (c.popup_image) { imgEl.src = c.popup_image; imgEl.style.display='block'; }
      // ============================================================

      // 「詳しく見る」ボタン（link_urlがある時だけ）
      if (c.link_url && c.link_url !== '') {
        btnEl.href = c.link_url;
        btnEl.style.display = 'inline-flex';
      } else {
        btnEl.style.display = 'none';
      }

      overlay.classList.add('is-open');
      overlay.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    } catch (e) { console.warn('[SchooMy Map LP v1.0] openCharModal error:', e); }
  }

  function closeCharModal() {
    try {
      const overlay = document.getElementById('schmCharModal');
      if (!overlay) return;
      overlay.classList.remove('is-open');
      overlay.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    } catch (e) { console.warn('[SchooMy Map LP v1.0] closeCharModal error:', e); }
  }

  // モーダルの閉じる操作（×ボタン / 背景クリック / ESC）
  (function setupModalClose() {
    const overlay = document.getElementById('schmCharModal');
    const closeBtn = document.getElementById('schmCharModalClose');
    if (closeBtn) closeBtn.addEventListener('click', closeCharModal);
    if (overlay) {
      overlay.addEventListener('click', function(e) {
        if (e.target === overlay) closeCharModal(); // 背景クリックのみ閉じる（カード内は無視）
      });
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeCharModal();
    });
  })();

  async function main() {
    try {
      const [cRes, sRes] = await Promise.all([fetch(CASES_CSV_URL), fetch(SENSORS_CSV_URL)]);
      const cData = csvToObjects(await cRes.text());
      const sData = csvToObjects(await sRes.text());

      const sensorMap = {};
      sData.forEach(s => { if(s.name && s.icon_url) sensorMap[s.name.trim()] = normalizeIconUrl(s.icon_url); });

      cases = cData.map(r => {
        const tagName = (r.tag1 || '').trim();
        let iconUrl = sensorMap[tagName] || '';
        if(!iconUrl) { for(let name in sensorMap) { if(tagName.includes(name) || name.includes(tagName)) { iconUrl = sensorMap[name]; break; } } }
        return {
          pos_left: r.pos_left || '50%', pos_top: r.pos_top || '50%',
          category: r.category, subtitle: r.subtitle, title: r.title, description: r.description,
          lp_ayashi: r.LPayashi || '', /* v1.15: コマリーのオバケのモーダル本文用。空欄ならdescriptionにフォールバック */
          photo: normalizeDriveUrl(r.photo_url || r.url),
          icon: iconUrl || normalizeDriveUrl(r.photo_url || r.url),
          url: r.url || ''
        };
      });

      const indices = [...Array(cases.length).keys()];
      navOrder = shuffle(indices);
      activeCaseIdx = navOrder[0];

      const totEl = document.getElementById('schmMapCounterTot');
      const loadingEl = document.getElementById('schmMapLoading');
      const readyEl = document.getElementById('schmMapReady');
      if (totEl) totEl.textContent = String(cases.length).padStart(2, '0');
      if (loadingEl) loadingEl.style.display = 'none';
      if (readyEl) readyEl.style.display = 'flex';

      // v1.7: 事例ピン・事例カードは非表示（マップはキャラのみ）。
      //       描画とオートプレイを止める。casesの読み込み自体は残してあるので、
      //       将来また事例を出したい時はこの3行を有効化すれば戻せる。
      // renderAnchors();
      // renderCard();
      // if (autoplay) startTimer();

      loadCharacters().catch(e => console.warn('[SchooMy Map LP v1.7] characters load error:', e));
      startGhosts(); // v1.9: コマリーのオバケを元センサー位置にランダム出現

      setTimeout(function() { try { adjustCardPosition(); applyScale(); } catch (e) {} }, 50);
    } catch (e) { console.error('[SchooMy Map LP v1.0] main error:', e); }
  }

  async function loadCharacters() {
    try {
      const res = await fetch(CHARACTERS_CSV_URL);
      const text = await res.text();
      const data = csvToObjects(text);
      if (data.length === 0) return;

      characters = data
        .filter(r => isActiveValue(r.active))
        .filter(r => (r.image_url || '').trim() !== '')
        .filter(r => isValidPosValue(r.pos_left) && isValidPosValue(r.pos_top))
        .map(r => ({
          name: r.name || '',
          image: normalizeIconUrl(r.image_url),
          pos_left: r.pos_left || '50%',
          pos_top: r.pos_top || '50%',
          message: r.message || '',
          lp_message: r.LPmessage || '', /* v1.11: モーダル本文用。空欄ならmessageにフォールバック */
          link_url: r.link_url || '',
          bubble_dir: (r.bubble_dir || '').trim().toLowerCase(),
          size: resolveCharSize(r.size),
          bubble_color: resolveBubbleColor(r.bubble_color)
        }));

      renderCharacters();
    } catch (e) { console.warn('[SchooMy Map LP v1.0] loadCharacters error:', e); }
  }

  function decideBubbleDir(posLeft, posTop, override) {
    if (override && ['br','bl','tr','tl'].includes(override)) return override;
    const x = parseFloat(posLeft) || 50;
    const y = parseFloat(posTop) || 50;
    const horiz = x < 60 ? 'r' : 'l';
    const vert = y < 50 ? 'b' : 't';
    return vert + horiz;
  }

  function renderCharacters() {
    try {
      const wrap = document.getElementById('schmCharWrap');
      if (!wrap) return;

      charBubbleTimers.forEach(t => {
        if (t.showTimeout) clearTimeout(t.showTimeout);
        if (t.hideTimeout) clearTimeout(t.hideTimeout);
      });
      charBubbleTimers.length = 0;
      wrap.innerHTML = '';

      characters.forEach((c, i) => {
        const anchor = document.createElement('div');
        anchor.className = 'schm-char-anchor';
        anchor.style.left = c.pos_left;
        anchor.style.top = c.pos_top;
        anchor.style.setProperty('--schm-char-size', c.size + 'px');
        // v6.0: キャラサイズの比率（中=70pxを1.0として）も設定。clamp連動で使う
        anchor.style.setProperty('--schm-char-ratio', (c.size / 70).toString());
        anchor.style.setProperty('--schm-bubble-color', c.bubble_color);

        const hasLink = c.link_url && c.link_url !== '';
        const hasMessage = c.message && c.message.trim() !== '';
        // v1.0: メッセージ or リンクがあればクリックでモーダル表示。両方無ければ飾り（クリック無効）
        const clickable = hasMessage || hasLink;

        const imgWrap = document.createElement('div');
        imgWrap.className = 'schm-char-img-wrap' + (clickable ? '' : ' no-link');
        const img = document.createElement('img');
        img.src = c.image;
        img.alt = c.name || 'character';
        img.draggable = false;
        imgWrap.appendChild(img);

        // v1.0: window.open廃止 → ページ内モーダルを開く
        if (clickable) {
          imgWrap.addEventListener('click', () => openCharModal(c));
        }

        anchor.appendChild(imgWrap);

        if (hasMessage) {
          const dir = decideBubbleDir(c.pos_left, c.pos_top, c.bubble_dir);
          const bubble = document.createElement('div');
          bubble.className = 'schm-char-bubble dir-' + dir + (clickable ? '' : ' no-link');
          bubble.textContent = c.message;

          const tail = document.createElement('div');
          tail.className = 'schm-char-bubble-tail';
          bubble.appendChild(tail);

          // v1.0: 吹き出しクリックでもモーダルを開く
          if (clickable) {
            bubble.addEventListener('click', () => openCharModal(c));
          }

          anchor.appendChild(bubble);

          const timerSet = { showTimeout: null, hideTimeout: null };
          charBubbleTimers.push(timerSet);

          const startCycle = () => {
            bubble.classList.add('is-visible');
            const showDuration = randInt(CHAR_BUBBLE_SHOW_MIN, CHAR_BUBBLE_SHOW_MAX);
            timerSet.hideTimeout = setTimeout(() => {
              bubble.classList.remove('is-visible');
              const hideDuration = randInt(CHAR_BUBBLE_HIDE_MIN, CHAR_BUBBLE_HIDE_MAX);
              timerSet.showTimeout = setTimeout(startCycle, hideDuration);
            }, showDuration);
          };

          const initialDelay = randInt(0, CHAR_BUBBLE_INITIAL_DELAY_MAX);
          timerSet.showTimeout = setTimeout(startCycle, initialDelay);
        }

        wrap.appendChild(anchor);
      });
    } catch (e) { console.warn('[SchooMy Map LP v1.0] renderCharacters error:', e); }
  }

  function renderAnchors() {
    try {
      const wrap = document.getElementById('schmMapPinWrap');
      if (!wrap) return;
      wrap.innerHTML = '';
      cases.forEach((c, i) => {
        const anchor = document.createElement('div');
        anchor.className = 'schm-map-bubble-anchor';
        anchor.style.left = c.pos_left; anchor.style.top = c.pos_top;

        const mini = document.createElement('div');
        mini.className = 'schm-map-mini-icon';
        mini.innerHTML = `<img src="${c.icon}" alt="">`;
        mini.onclick = () => {
          activeCaseIdx = i;
          navIdx = navOrder.indexOf(i);
          renderCard(true);
          resetTimer();
        };
        fetchSvgInline(c.icon).then(svgText => { if(svgText) mini.innerHTML = svgText; }).catch(()=>{});

        const dot = document.createElement('div');
        dot.className = 'schm-map-pin-dot';
        const bubble = document.createElement('div');
        const dir = (parseFloat(c.pos_top) < 50 ? 'b' : 't') + (parseFloat(c.pos_left) < 50 ? 'r' : 'l');
        bubble.className = 'schm-map-bubble dir-' + dir;
        bubble.innerHTML = `<img src="${c.photo}" class="bubble-photo">`;
        const tail = document.createElement('div'); tail.className = 'schm-map-bubble-tail';
        bubble.appendChild(tail);

        anchor.appendChild(dot);
        anchor.appendChild(bubble);
        anchor.appendChild(mini);
        wrap.appendChild(anchor);
      });
    } catch (e) { console.warn('[SchooMy Map LP v1.0] renderAnchors error:', e); }
  }

  function renderCard(userInitiated) {
    try {
      const d = cases[activeCaseIdx];
      if (!d) return;
      const anchors = document.querySelectorAll('.schm-map-bubble-anchor');
      anchors.forEach((a, i) => a.classList.toggle('is-active', i === activeCaseIdx));

      const heroImg = document.getElementById('schmMapHeroImg');
      const caseCat = document.getElementById('schmMapCaseCat');
      const caseSubtitle = document.getElementById('schmMapCaseSubtitle');
      const caseTitle = document.getElementById('schmMapCaseTitle');
      const caseDesc = document.getElementById('schmMapCaseDesc');
      const caseLink = document.getElementById('schmMapCaseLink');
      const counterCur = document.getElementById('schmMapCounterCur');
      const cardIcon = document.getElementById('schmMapCardIcon');

      if (heroImg) heroImg.src = d.photo;
      if (caseCat) caseCat.textContent = d.category;
      if (caseSubtitle) caseSubtitle.textContent = d.subtitle;
      if (caseTitle) caseTitle.textContent = d.title;
      if (caseDesc) caseDesc.textContent = d.description;
      if (caseLink) caseLink.href = d.url || '#';
      if (counterCur) counterCur.textContent = String(navIdx + 1).padStart(2, '0');

      if (cardIcon) {
        cardIcon.innerHTML = `<img src="${d.icon}" alt="">`;
        fetchSvgInline(d.icon).then(svgText => { if(svgText) cardIcon.innerHTML = svgText; }).catch(()=>{});
      }

      // v1.1: モバイルの横スクロールは「ユーザーがピンをタップした時」だけ。
      //       自動再生(タイマー)では動かさず、ユーザーの手動スクロールを邪魔しない。
      if (userInitiated && window.innerWidth <= 760) {
        const box = document.getElementById('schmMapBox');
        if (box) {
          const target = (parseFloat(d.pos_left) / 100 * box.scrollWidth) - (box.offsetWidth / 2);
          box.scrollTo({ left: target, behavior: 'smooth' });
        }
      }
    } catch (e) { console.warn('[SchooMy Map LP v1.1] renderCard error:', e); }
  }

  function startTimer() {
    if(timer) clearInterval(timer);
    timer = setInterval(() => {
      navIdx = (navIdx + 1) % navOrder.length;
      activeCaseIdx = navOrder[navIdx];
      renderCard();
    }, INTERVAL);
  }
  function stopTimer() { if(timer) clearInterval(timer); timer = null; }
  function resetTimer() { if(autoplay) startTimer(); }

  const playBtn = document.getElementById('schmMapPlayBtn');
  const prevBtn = document.getElementById('schmMapPrevBtn');
  const nextBtn = document.getElementById('schmMapNextBtn');

  if (playBtn) {
    playBtn.addEventListener('click', () => {
      autoplay = !autoplay;
      const playIcon = document.getElementById('schmMapPlayIcon');
      const pauseIcon = document.getElementById('schmMapPauseIcon');
      if (playIcon) playIcon.style.display = autoplay ? 'none' : 'block';
      if (pauseIcon) pauseIcon.style.display = autoplay ? 'block' : 'none';
      if(autoplay) startTimer(); else stopTimer();
    });
  }
  if (prevBtn) {
    prevBtn.addEventListener('click', () => {
      navIdx = (navIdx - 1 + navOrder.length) % navOrder.length;
      activeCaseIdx = navOrder[navIdx];
      renderCard(); resetTimer();
    });
  }
  if (nextBtn) {
    nextBtn.addEventListener('click', () => {
      navIdx = (navIdx + 1) % navOrder.length;
      activeCaseIdx = navOrder[navIdx];
      renderCard(); resetTimer();
    });
  }

  /* === v1.9: コマリー“オバケ”出現システム（cases位置を流用） === */
  const GHOST_COUNT = 3;
  const GHOST_LIFE_MIN = 4500, GHOST_LIFE_MAX = 8000; // 浮遊時間(ms)
  const GHOST_FADE_MS = 1700;                          // 退場フェード(ms)
  const ghostUsed = new Set();
  let ghostCases = [];

  function ghostPickFree(){
    const free = [];
    for (let i = 0; i < ghostCases.length; i++){ if (!ghostUsed.has(i)) free.push(i); }
    return free.length ? free[Math.floor(Math.random() * free.length)] : -1;
  }
  function spawnOneGhost(){
    try {
      const wrap = document.getElementById('schmCharWrap');
      if (!wrap) return;
      const ci = ghostPickFree();
      if (ci < 0) return;
      ghostUsed.add(ci);
      const c = ghostCases[ci];
      // v1.10: タップ時に即表示できるよう、この事例写真を軽く先読み（最大3体ぶんのみ）
      if (c.photo) { try { const pre = new Image(); pre.src = c.photo; } catch(e) {} }
      const el = document.createElement('div');
      el.className = 'schm-ghost';
      el.style.left = c.pos_left; el.style.top = c.pos_top;
      const img = document.createElement('img');
      img.src = 'assets/komari.png'; img.alt = 'コマリー'; img.draggable = false;
      el.appendChild(img);
      // タップ → 同じモーダル（写真=photo / 文章=LPayashi優先・空欄ならdescription / 詳しく見る=url）
      el.addEventListener('click', function(){
        try {
          if (typeof openCharModal === 'function') {
            const ghostText = (c.lp_ayashi && c.lp_ayashi.trim() !== '') ? c.lp_ayashi : (c.description || '');
            openCharModal({ image: c.photo, name: c.title, message: ghostText, link_url: c.url || '', bubble_color: '#E88A0A' });
          }
        } catch(e) {}
      });
      wrap.appendChild(el);
      // ふわっとフェードイン
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.classList.add('is-in'); }); });
      // 寿命後に退場
      const life = randInt(GHOST_LIFE_MIN, GHOST_LIFE_MAX);
      setTimeout(function(){ despawnGhost(el, ci); }, life);
    } catch(e) { console.warn('[SchooMy Map LP v1.9] spawnOneGhost error:', e); }
  }
  function despawnGhost(el, ci){
    try {
      el.classList.remove('is-in');
      el.classList.add('is-out'); // オバケっぽく上にスーッと消える
      setTimeout(function(){
        if (el && el.parentNode) el.parentNode.removeChild(el);
        ghostUsed.delete(ci);
        spawnOneGhost(); // 別の元センサー位置にまた出現
      }, GHOST_FADE_MS);
    } catch(e) {}
  }
  function startGhosts(){
    try {
      ghostCases = cases.filter(function(c){ return isValidPosValue(c.pos_left) && isValidPosValue(c.pos_top); });
      if (!ghostCases.length) return;
      const n = Math.min(GHOST_COUNT, ghostCases.length);
      for (let i = 0; i < n; i++){ setTimeout(spawnOneGhost, i * 700); }
    } catch(e) { console.warn('[SchooMy Map LP v1.9] startGhosts error:', e); }
  }

  // v1.8: イントロ完了後の自動モーダル表示用にopenCharModalを公開
  try { window.schmOpenCharModal = openCharModal; } catch(e) {}

  main();
})();
</script>

<!-- バージョン: LP v1.10 / 2026-05-31 / base: overlay v6.0 + map v3.5 / キャラクリック→ページ内モーダル
     v1.1変更: スマホで事例カードを非表示にし、マップ（スクーミーワールド）を画面全体の高さで表示。
              横スクロールでワールド全体を閲覧。自動再生による横スクロールのドリフトを抑止（タップ移動は維持）。
     v1.2変更: 全画面イントロを追加（背景オレンジ#E88A0A・透過PNG5枚をスクロール/スワイプ連動で切替→Loading→マップ）。毎回表示。画像URLはPART INTROのINTRO_IMAGES配列で差し替え。
     v1.3変更: イントロ背景色をキャラの髪のオレンジ #E3AB4A に変更（ブランドオレンジ#E88A0Aはマップ内ボタン等で維持）。
     v1.4変更: イントロ/Loading背景を壁紙準拠の#E4A334に。Loading画面に後ろ向きの男の子(assets/intro-boy.png)を中央表示し、スピナーを4色(ティール/クリーム/オレンジ/ブルー)の左→右フローバーに変更。
     v1.5変更: Loadingに「じっ」(assets/intro-jitsu.png)を男の子の上に追加。進行バーを“流れ”から“0→100%の確定進行”に変更(満タン=完了→マップ)。白トラックに影＋枠を付けオレンジ背景でも目立つように。男の子を142pxに。
     v1.6変更: 進行バーをグラデから“べた塗り4色”に(比率 ティール31/クリーム46/オレンジ8/ブルー15、縦帯画像準拠・色はブランドhex)。じっ76px/男の子96px(スマホは62/80)に縮小。
     v1.7変更: マップ上の事例ピン(センサーアイコン+写真吹き出し)と左下の事例カードを非表示にし、マップはキャラのみに。casesの読み込みは温存（main内の3行を戻せば復活可）。
     v1.8変更: Loadingの「Loading…」テキスト削除。イントロ完了後に「コマリー」紹介モーダルを自動表示(既存モーダル流用・ボタン無し・画像assets/komari.png仮)。openCharModalをwindowに公開しPART INTROから呼ぶ。
     v1.9変更: コマリーを“オバケ”として元センサー位置(cases)にランダム3体出現。ふわっと出て→浮遊→上にスーッと消え→別位置に再出現。タップで同じモーダル(写真=photo/文章=description/詳しく見る=url)。データは既存casesを流用。
     v1.10変更: モーダル画像のラグ対策。別画像に変わる時だけ前画像を即クリア→onloadでフェード表示(キャッシュ済みは即表示)。コマリー出現時にその事例写真を1枚だけ軽く先読み(最大3枚・全件先読みはしない=重くしない)。 -->

<script>
/* PART INTRO (v1.2): スクロール連動の画像イントロ → Loading → マップ表示 */
(function(){
  'use strict';

  // ★★★ 本番画像はここを差し替え（透過PNGのURLを順番に。枚数の増減も可）★★★
  const INTRO_IMAGES = [
    'https://schoomy.com/wp-content/uploads/2026/05/ayashi01.png',
    'https://schoomy.com/wp-content/uploads/2026/05/ayashi02.png',
    'https://schoomy.com/wp-content/uploads/2026/05/ayashi03.png',
    'https://schoomy.com/wp-content/uploads/2026/05/ayashi04.png',
    'https://schoomy.com/wp-content/uploads/2026/05/ayashi05.png'
  ];
  // ★★★ ここまで ★★★

  const LOADING_MS = 1900; // バーが0→100%に進む時間(ms)=Loading完了まで

  const intro = document.getElementById('schmIntro');
  if (!intro) return;
  if (!INTRO_IMAGES.length) { intro.parentNode && intro.parentNode.removeChild(intro); return; }

  const stage   = document.getElementById('schmIntroStage');
  const loading = document.getElementById('schmIntroLoading');
  const hint    = document.getElementById('schmIntroHint');
  const skip    = document.getElementById('schmIntroSkip');

  let idx = 0, animating = false, finished = false;

  document.body.classList.add('schm-intro-lock');

  // スライド生成（v1.13: ドット廃止）
  INTRO_IMAGES.forEach(function(src, i){
    const slide = document.createElement('div');
    slide.className = 'schm-intro-slide' + (i === 0 ? ' is-active' : '');
    const img = document.createElement('img');
    img.src = src; img.alt = 'intro ' + (i+1); img.draggable = false;
    slide.appendChild(img);
    stage.appendChild(slide);
  });
  const slides = stage.querySelectorAll('.schm-intro-slide');

  function show(n){
    slides.forEach(function(s, i){ s.classList.toggle('is-active', i === n); });
  }

  function advance(){
    if (animating || finished) return;
    if (idx < INTRO_IMAGES.length - 1) {
      animating = true; idx++; show(idx);
      setTimeout(function(){ animating = false; }, 560);
    } else {
      finish();
    }
  }
  function back(){
    if (animating || finished) return;
    if (idx > 0) {
      animating = true; idx--; show(idx);
      setTimeout(function(){ animating = false; }, 560);
    }
  }
  function finish(){
    if (finished) return; finished = true;
    if (hint) hint.style.display = 'none';
    loading.classList.add('is-active');
    // v1.5: バーを0→100%へ進め、満タンになったら完了→マップへ
    const fill = document.getElementById('schmIntroBarFill');
    const start = performance.now();
    function step(now){
      const p = Math.min(1, (now - start) / LOADING_MS);
      if (fill) fill.style.width = (p * 100) + '%';
      if (p < 1) { requestAnimationFrame(step); }
      else { closeIntro(); }
    }
    requestAnimationFrame(step);
  }
  function closeIntro(){
    intro.classList.add('is-hidden');
    intro.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('schm-intro-lock');
    setTimeout(function(){ if (intro && intro.parentNode) intro.parentNode.removeChild(intro); }, 700);
    try { window.dispatchEvent(new Event('resize')); } catch(e){}
    // v1.8: イントロ後にまず「コマリー」紹介モーダルを自動表示（ボタン無し）
    setTimeout(function(){
      try {
        if (typeof window.schmOpenCharModal === 'function') {
          window.schmOpenCharModal({
            image: 'assets/komari.png',
            name: 'コマリー',
            message: 'あやしい。と思ったところにたまにあらわれるオバケ。ヒトがあやしいと思い「もしかしたら、こうかも、、、」と思った言葉になる前の想いが集まって見えるようになったと言われている。あやしいと思わなくなったヒトには見えなくなるウワサがある。',
            link_url: '',
            bubble_color: '#E88A0A'
          });
        }
      } catch(e) {}
    }, 720);
  }

  // ホイール（1ジェスチャ=1枚。クールダウンで取りこぼし/飛ばし防止）
  let wheelAcc = 0, wheelCD = false;
  intro.addEventListener('wheel', function(e){
    e.preventDefault();
    if (finished || wheelCD) return;
    wheelAcc += e.deltaY;
    if (Math.abs(wheelAcc) > 40) {
      (wheelAcc > 0) ? advance() : back();
      wheelAcc = 0; wheelCD = true;
      setTimeout(function(){ wheelCD = false; }, 650);
    }
  }, { passive: false });

  // タッチ（スワイプ上=進む / 下=戻る）
  let touchY = null;
  intro.addEventListener('touchstart', function(e){ touchY = e.touches[0].clientY; }, { passive: true });
  intro.addEventListener('touchmove', function(e){ e.preventDefault(); }, { passive: false });
  intro.addEventListener('touchend', function(e){
    if (finished || touchY === null) return;
    const dy = touchY - e.changedTouches[0].clientY;
    if (Math.abs(dy) > 40) { (dy > 0) ? advance() : back(); }
    touchY = null;
  }, { passive: true });

  // キーボード（↓/Space=進む, ↑=戻る）
  window.addEventListener('keydown', function(e){
    if (finished) return;
    if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); advance(); }
    else if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); back(); }
  });

  // タップ/クリックでも進む
  stage.addEventListener('click', function(){ advance(); });
  // スキップ
  if (skip) skip.addEventListener('click', finish);
})();
</script>

</body>
